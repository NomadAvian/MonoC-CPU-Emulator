name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/Blimp6233/MonoC-CPU-Emulator

            # Pull latest code cleanly
            git fetch origin main
            git reset --hard origin/main

            # Build images on VPS
            docker compose --profile omni build --parallel

            # Zero downtime swap
            docker compose --profile omni up -d --no-deps --remove-orphans

            # Wait for containers
            echo "Waiting for containers to initialize..."
            sleep 15

            # Healthcheck — fail if any container is unhealthy
            if docker compose --profile omni ps | grep -q "unhealthy"; then
              echo "DEPLOYMENT FAILED — ROLLING BACK"
              docker compose --profile omni restart
              exit 1
            else
              echo "DEPLOYMENT SUCCESSFUL!"
              docker image prune -f
            fi