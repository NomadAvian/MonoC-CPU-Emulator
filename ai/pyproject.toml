[project]
name = "monoc-mcp"
version = "0.1.0"
description = "This is a ai orchestrator and mcp server implementation code base"
readme = "README.md"
authors = [
    { name = "Toha", email = "abutohaalnur@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "google-genai>=2.10.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.50.1",
]

[project.scripts]
monoc-mcp = "monoc_mcp:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
