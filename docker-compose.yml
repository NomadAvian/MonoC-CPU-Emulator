services:
  caddy:
    image: caddy:alpine
    container_name: monoc-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - python-api
      - cpp-api
    restart: unless-stopped

  frontend:
    image: monoc/frontend:latest
    container_name: monoc-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        # caddy handles routing; frontend talks to same origin
        VITE_AI_API_URL: ""
        VITE_CPU_API_URL: ""
    restart: unless-stopped

  python-api:
    image: monoc/py:latest
    container_name: monoc-py
    build:
      context: ./backend/ai
      dockerfile: Dockerfile.python
    env_file: .env                          # user secrets
    environment:                            # internal docker networking
      CROW_BASE_URL: http://monoc-cpu:6969
      DB_PATH: /app/db/monoc.db
      CORS_ORIGINS: http://localhost
      OMNIROUTE_BASE_URL: http://omniroute:20128/v1
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    volumes:
      - monoc_db:/app/db
    depends_on:
      - cpp-api
    restart: unless-stopped

  cpp-api:
    image: monoc/cpu:latest
    container_name: monoc-cpu
    build:
      context: .
      dockerfile: backend/Dockerfile.cpp
    environment:
      PORT: 6969
    restart: unless-stopped

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: monoc-models
    profiles:
      - omni
    ports:
      - "20128:20128"
    volumes:
      - omniroute_data:/app/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: monoc-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  monoc_db:
  omniroute_data:
  ollama_data:
