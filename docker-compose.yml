services:
#  # Optional Caddy Reverse Proxy Template
#  # Uncomment this block to run Caddy inside Docker (e.g. for automatic HTTPS or local routing)
#  caddy:
#    image: caddy:alpine
#    container_name: monoc-proxy
#    ports:
#      - "80:80"
#      - "443:443"
#    volumes:
#      - ./Caddyfile:/etc/caddy/Caddyfile:ro
#      - caddy_data:/data
#      - caddy_config:/config
#    depends_on:
#      - frontend
#      - python-api
#      - cpp-api
#    restart: unless-stopped
  frontend:
    image: monoc/frontend:latest
    container_name: monoc-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_AI_API_URL: ""
        VITE_CPU_API_URL: ""
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  python-api:
    image: monoc/py:latest
    container_name: monoc-py
    build:
      context: ./backend/ai
      dockerfile: Dockerfile.python
    env_file: .env
    environment:
      CROW_BASE_URL: http://monoc-cpu:6969
      DB_PATH: /app/db/monoc.db
      CORS_ORIGINS: http://localhost
      OMNIROUTE_BASE_URL: http://omniroute:20128/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - monoc_db:/app/db
    depends_on:
      - cpp-api
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  cpp-api:
    image: monoc/cpu:latest
    container_name: monoc-cpu
    build:
      context: .
      dockerfile: backend/Dockerfile.cpp
    environment:
      PORT: 6969
    ports:
      - "127.0.0.1:6969:6969"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6969/cpu/registers || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: monoc-models
    profiles:
      - omni
    ports:
      - "20128:20128"
    volumes:
      - omniroute_data:/app/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: monoc-ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  monoc_db:
  omniroute_data:
  ollama_data:
#  caddy_data:
#  caddy_config: