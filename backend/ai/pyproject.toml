[project]
name = "monoc-mcp"
version = "0.1.0"
description = "This is an AI orchestrator and mcp server implementation code base for MonoC Cpu Emulator"
authors = [
    { name = "Toha", email = "abutohaalnur@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "google-genai>=2.10.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.0,<2.0",
    "ollama>=0.6.2",
    "openai>=1.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.50.1",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.1",
]

[tool.setuptools]
packages = ["chat", "emulator"]
